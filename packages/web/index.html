<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

		<!-- Favicons — logo Boutons-Toque (encre + gland jaune sur crème).
		     « ?v=2 » : Safari garde les icônes en cache des semaines ; changer
		     l'URL force le nouveau logo. Incrémenter à chaque changement d'icône. -->
		<link rel="icon" href="/favicon.ico?v=2" sizes="any" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />

		<!-- Startbildschirm (iOS + Android). iPhone/iPad prennent cette icône
		     180×180 (pleine, coins carrés : iOS arrondit lui-même), pas celles du manifest. -->
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#FDFBF7" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="TRED" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="application-name" content="TRED" />

		<!-- Social Preview -->
		<meta
			name="description"
			content="TRED — dein KI-Tutor für das Ingenieurstudium, auf Basis deiner eigenen Vorlesungsunterlagen."
		/>
		<meta property="og:site_name" content="TRED" />
		<meta property="og:title" content="TRED" />
		<meta property="og:description" content="Dein Kurs. Dein Tempo." />
		<meta property="og:type" content="website" />
		<!-- URL absolue : WhatsApp, iMessage, LinkedIn ignorent une image relative. -->
		<meta property="og:image" content="https://www.tred-tutor.de/og-image.png?v=2" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Logo TRED — Dein Kurs. Dein Tempo." />
		<meta name="twitter:card" content="summary_large_image" />

		<!-- Polices auto-hébergées (RGPD) : voir src/web/styles.css. On précharge
		     seulement le texte courant, les autres arrivent avec le CSS. -->
		<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
		<title>TRED — KI-Tutor für das Ingenieurstudium</title>
	</head>
	<body>
		<div id="root"></div>
		<!-- Pour les robots sans JavaScript (et les navigateurs qui l'ont coupé) :
		     ce que fait TRED et où lire la suite. Invisible quand JS tourne. -->
		<noscript>
			<main style="max-width:40rem;margin:3rem auto;padding:0 1rem;font-family:system-ui,sans-serif;line-height:1.6;color:#0F172A">
				<h1>TRED — dein KI-Tutor für das Ingenieurstudium</h1>
				<p>TRED beantwortet deine Fragen auf Basis deiner eigenen Vorlesungsunterlagen, zitiert die Seite, aus der jede Antwort stammt, und zeichnet exakte Schnittgrößenverläufe mit einem Statik-Löser. Für Studierende der Ingenieurwissenschaften in Deutschland.</p>
				<p>Für die App wird JavaScript benötigt.</p>
				<ul>
					<li><a href="/landing">TRED entdecken</a></li>
					<li><a href="/security">Sicherheit &amp; Datenschutz</a></li>
					<li><a href="/datenschutz">Datenschutzerklärung</a></li>
					<li><a href="/impressum">Impressum</a></li>
					<li><a href="/agb">AGB</a></li>
				</ul>
			</main>
		</noscript>
		<!-- Thème appliqué AVANT le premier rendu : pas d'éclair blanc en mode sombre.
		     Même clé que stores/theme.ts (« aerostudy-theme », version 1). -->
		<script>
			try {
				var s = JSON.parse(localStorage.getItem("aerostudy-theme") || "{}");
				var t = s.version >= 1 && s.state ? s.state.theme : "light";
				var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
				if (d) {
					document.documentElement.classList.add("dark");
					document.documentElement.style.colorScheme = "dark";
				}
			} catch (e) {}
		</script>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
