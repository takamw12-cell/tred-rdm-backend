# Garde-fou de chaque modification : typecheck, tests, build de production.
#
# Tourne sur chaque Pull Request (dont celles de Dependabot) et sur chaque
# push sur master. Une étape rouge = la PR n'est pas fusionnée.
#
# Les mises à jour MINEURES et CORRECTIFS STABLES de Dependabot sont
# fusionnées automatiquement par le job « automerge », qui ne démarre QUE si
# « verify » a réussi (needs). Jamais fusionnées seules : les MAJEURES, les
# PRÉ-VERSIONS (alpha, beta, rc…) et les mineures d'un paquet en 0.x — elles
# attendent ta validation (MAINTENANCE.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Même version de Bun que le projet (« packageManager » de package.json).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Installer les dépendances (lockfile figé)
        run: bun install --frozen-lockfile

      - name: Typecheck (application + serveur)
        run: bun run --cwd packages/web typecheck

      - name: Tests
        run: bun test --cwd packages/web

      # Le build pré-rend les pages publiques dans Chromium (comme le Dockerfile).
      - name: Chromium pour le pré-rendu
        run: bunx playwright@1.64.1 install --with-deps chromium

      - name: Build de production
        run: bun run --cwd packages/web build

      # Tout ce qui est dans dist/ est public. Une clé qui s'y glisse = rouge.
      - name: Aucun secret dans le bundle du navigateur
        run: bun packages/web/scripts/check-bundle-secrets.ts

  automerge:
    name: Fusion auto (Dependabot — mineures et correctifs)
    needs: verify
    # Seulement une PR OUVERTE PAR Dependabot, et seulement si « verify » est vert.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Garde-fou (décision fondateur 2026-11-09, après konsistent 1.0.0-beta) :
      # on ne fusionne seul QUE du stable. Bloqué si UNE SEULE dépendance de
      # la PR est :
      #   • une majeure ;
      #   • une pré-version (alpha, beta, rc, canary, next, dev, preview…),
      #     avant OU après la mise à jour — pour semver, beta.8 → beta.12 est
      #     un « correctif », d'où la vérification explicite ;
      #   • une MINEURE d'un paquet en 0.x : en 0.x, une « mineure » peut
      #     casser (règle semver). Les correctifs 0.x passent.
      # Tout le reste (mineures et correctifs stables, y compris les
      # correctifs de sécurité) est fusionné si « verify » est vert.
      - name: Stable et sans risque ?
        id: gate
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pour une PR GROUPÉE, fetch-metadata ne donne pas les versions : on
          # les lit dans le tableau « Package | From | To » de la PR (et les
          # lignes « Bumps/Updates X from A to B »). Version introuvable =
          # PAS de fusion automatique (sécurité par défaut).
          gh pr view "$PR_URL" --json body -q .body > pr-body.md
          python3 - <<'PY'
          import json, os, re
          deps = json.loads(os.environ.get("DEPS") or "[]")
          body = open("pr-body.md", encoding="utf-8").read()
          seen = {}
          for name, a, b in re.findall(r"^\|\s*\[?([^\]|]+?)\]?(?:\([^)]*\))?\s*\|\s*`([^`]+)`\s*\|\s*`([^`]+)`\s*\|", body, re.M):
              seen[name.strip()] = (a.strip(), b.strip())
          for name, a, b in re.findall(r"(?:Bumps|Updates) \[?`?([^\]`\s]+)`?\]?(?:\([^)]*\))? from ([^\s]+) to ([^\s.]+(?:\.[^\s.]+)*?)\.?(?:\s|$)", body):
              seen.setdefault(name.strip(), (a.strip(), b.strip()))
          blocked = []
          for d in deps:
              name = d.get("dependencyName", "?")
              kind = d.get("updateType", "")
              prev = d.get("prevVersion") or seen.get(name, ("", ""))[0]
              new = d.get("newVersion") or seen.get(name, ("", ""))[1]
              print(f"{name}: {prev or '?'} -> {new or '?'} ({kind})")
              if kind not in ("version-update:semver-minor", "version-update:semver-patch"):
                  blocked.append(f"{name} (majeure)")
              elif not prev or not new:
                  blocked.append(f"{name} (version illisible)")
              elif "-" in prev or "-" in new:
                  blocked.append(f"{name} (pré-version {new})")
              elif kind.endswith("minor") and prev.startswith("0."):
                  blocked.append(f"{name} (mineure 0.x {prev} -> {new})")
          if not deps:
              blocked.append("aucune dépendance lue")
          ok = not blocked
          if not ok:
              print("Non fusionnée automatiquement : " + ", ".join(blocked))
              print("Validation manuelle : MAINTENANCE.md")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
          PY

      - name: Fusionner (mineure ou correctif STABLE)
        if: steps.gate.outputs.ok == 'true'
        run: gh pr merge "$PR_URL" --squash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
