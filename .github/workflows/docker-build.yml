# Build de test de l'image de déploiement.
#
# Railway construit l'image à chaque push sur master, sans attendre la CI : un
# Dockerfile cassé y bloquerait tous les déploiements. Ce flux construit donc la
# MÊME image ici, sur la branche, avant toute fusion — y compris les contrôles
# intégrés au Dockerfile (chaîne LaTeX, SymPy).
#
# Il ne pousse rien et ne déploie rien.
name: Docker (build de test)

on:
  push:
    branches: [feat/video-engine]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - packages/web/src/api/sympy/**
      - .github/workflows/docker-build.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: image de déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image (comme Railway)
        run: docker build --progress=plain -t tred-image-test .

      - name: Taille de l'image
        run: docker image inspect tred-image-test --format '{{.Size}}' | awk '{printf "%.0f Mo\n", $1 / 1048576}'
